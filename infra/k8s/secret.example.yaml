# DB 비밀번호 Secret 예시
#
# 이 파일을 secret.yaml 로 복사해서 값을 바꾼 뒤 적용하세요.
#   cp infra/k8s/secret.example.yaml infra/k8s/secret.yaml
#   kubectl apply -f infra/k8s/secret.yaml
#
# secret.yaml 은 .gitignore 에 걸려 있어서 Git에 올라가지 않아요.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: dealflow
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root
  MYSQL_PASSWORD: change-me
