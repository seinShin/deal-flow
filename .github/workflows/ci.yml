name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # build.gradle의 JavaLanguageVersion.of(..) 숫자와 맞추세요 (21 또는 25)
  JAVA_VERSION: '21'

jobs:
  # ===== 백엔드: 테스트 + 빌드 =====
  backend:
    name: Backend test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 기본 테스트(contextLoads)가 DB에 접속하므로 테스트용 MySQL을 같이 띄움
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dealflow
          MYSQL_USER: dealflow
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: dealflow
      DB_USER: dealflow
      DB_PASSWORD: ci-password
      DB_PORT: '3306'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Windows에서 커밋하면 실행 권한이 빠질 수 있어서 보정
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon -x test

  # ===== 프론트: 린트 + 빌드 =====
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ===== main에 머지됐을 때만: 이미지 빌드 후 GHCR에 push =====
  docker:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR 주소는 소문자만 허용 → 계정 이름을 소문자로 변환
      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: JAVA_VERSION=${{ env.JAVA_VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/deal-flow-backend:latest
            ${{ env.IMAGE_PREFIX }}/deal-flow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/deal-flow-frontend:latest
            ${{ env.IMAGE_PREFIX }}/deal-flow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
